<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Daily English Challenge</title>
    <link rel="apple-touch-icon" sizes="180x180" href="../icons/game/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../icons/game/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../icons/game/favicon-16x16.png">
    <link rel="manifest" href="../icons/game/site.webmanifest">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="app-container glass">
        <header>
            <div class="header-top">
                <div class="progress-bar-container">
                    <div id="progress-bar" class="progress-bar"></div>
                </div>
                <button id="theme-toggle" class="btn-icon" aria-label="Alternar Tema">
                    <svg id="icon-sun" class="theme-icon hidden" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg id="icon-moon" class="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </header>

        <main id="game-area">
            
            <div id="start-screen" class="screen active">
                <div class="icon-hero">📅</div>
                <h1>Daily Focus</h1>
                <p>Complete seus 3 exercícios essenciais de hoje.</p>
                <button id="start-btn" class="btn btn-primary">Iniciar Sessão</button>
                <p id="streak-display" class="streak-text">🔥 0 day streak</p>
            </div>

            <div id="game-screen" class="screen hidden">
                <h6 id="question-type" class="overline">Grammar Check</h6>
                
                <div id="challenge-display" class="challenge-box">
                    </div>

                <div id="interaction-area" class="interaction-area">
                    </div>

                <div id="feedback-area" class="feedback-area hidden">
                    <p id="feedback-text"></p>
                    <button id="next-btn" class="btn btn-primary hidden">Continuar</button>
                </div>
            </div>

            <div id="result-screen" class="screen hidden">
                <div class="icon-hero">🎉</div>
                <h1>Sessão Concluída</h1>
                <p class="result-subtitle">Você acertou <span id="final-score" class="highlight-text">0</span> de 3 exercícios.</p>
                
                <div class="result-card glass-card">
                    <p>Próxima sessão disponível em:</p>
                    <div id="countdown" class="countdown"></div>
                </div>

                <button id="retry-btn" class="btn btn-ghost" style="margin-top: 24px;">
                    ↺ Refazer Sessão
                </button>
            </div>
            
            <div id="locked-screen" class="screen hidden">
                <div class="icon-hero">✅</div>
                <h1>Tudo pronto por hoje</h1>
                <p>Sua consistência está registrada.</p>
                <div class="result-card glass-card">
                     <p>Volte em:</p>
                    <div id="countdown-locked" class="countdown"></div>
                </div>
                <button id="retry-locked-btn" class="btn btn-ghost" style="margin-top: 24px;">
                    ↺ Praticar Novamente
                </button>
            </div>

        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
