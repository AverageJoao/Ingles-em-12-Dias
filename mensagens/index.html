<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Simulator - Video Editing Rates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom scrollbar for Discord look */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #2e3338; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #202225; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #18191c; 
        }
        body {
            font-family: 'gg sans', 'Noto Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #36393f;
            color: #dcddde;
        }
        .message-hover:hover {
            background-color: #32353b;
        }
    </style>
</head>
<body class="h-screen w-full flex overflow-hidden selection:bg-[#5865F2] selection:text-white">

    <!-- Server Sidebar (Leftmost) -->
    <div class="w-[72px] bg-[#202225] hidden sm:flex flex-col items-center py-3 space-y-2 flex-shrink-0 z-20">
        <!-- Discord Icon -->
        <div class="w-12 h-12 bg-[#36393f] rounded-[24px] hover:rounded-[16px] hover:bg-[#5865F2] transition-all duration-200 flex items-center justify-center cursor-pointer group">
            <svg class="w-7 h-7 text-[#dcddde] group-hover:text-white" fill="currentColor" viewBox="0 0 127.14 96.36"><path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S54,46,53.89,53,48.84,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.31,60,73.31,53s5-12.74,11.43-12.74S96.2,46,96.12,53,91.08,65.69,84.69,65.69Z"/></svg>
        </div>
        <div class="w-8 h-[2px] bg-[#36393f] rounded-full"></div>
        <!-- Server Icon -->
        <div class="w-12 h-12 bg-[#5865F2] rounded-[16px] text-white font-bold text-lg flex items-center justify-center cursor-pointer shadow-lg relative">
            VE
            <div class="absolute -left-3 w-2 h-10 bg-white rounded-r-full"></div>
        </div>
    </div>

    <!-- Channels Sidebar -->
    <div class="w-60 bg-[#2f3136] flex-shrink-0 flex flex-col z-10 hidden md:flex">
        <!-- Server Header -->
        <div class="h-12 border-b border-[#202225] flex items-center px-4 shadow-sm hover:bg-[#34373c] cursor-pointer transition-colors">
            <h1 class="font-bold text-white truncate flex-1">Video Editors Hub</h1>
            <svg class="w-4 h-4 text-[#dcddde]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
        </div>
        <!-- Channels List -->
        <div id="channel-list" class="flex-1 overflow-y-auto pt-3 px-2 custom-scrollbar space-y-0.5 pb-2">
            <!-- Channels and Categories will be injected here -->
        </div>
        <!-- User Profile (Bottom) -->
        <div class="h-[52px] bg-[#292b2f] flex items-center px-2 py-1.5 space-x-2">
            <div class="w-8 h-8 rounded-full bg-emerald-500 flex items-center justify-center text-white font-bold text-sm relative cursor-pointer">
                E
                <div class="absolute bottom-0 right-0 w-3 h-3 bg-green-500 border-2 border-[#292b2f] rounded-full"></div>
            </div>
            <div class="flex-1 min-w-0">
                <div class="text-sm font-semibold text-white truncate leading-tight">Editor</div>
                <div class="text-xs text-[#b9bbbe] truncate leading-tight">#online</div>
            </div>
            <div class="flex space-x-1">
                <button class="w-8 h-8 rounded hover:bg-[#3ba55c] hover:text-white text-[#b9bbbe] flex items-center justify-center transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path></svg>
                </button>
                <button class="w-8 h-8 rounded hover:bg-[#3ba55c] hover:text-white text-[#b9bbbe] flex items-center justify-center transition-colors">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Chat Area -->
    <div class="flex-1 flex flex-col bg-[#36393f] min-w-0">
        <!-- Chat Header -->
        <div class="h-12 border-b border-[#202225] flex items-center px-4 shadow-sm">
            <div class="md:hidden mr-4 text-[#8e9297] cursor-pointer" onclick="toggleMobileSidebar()">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </div>
            <svg class="w-6 h-6 text-[#8e9297] mr-2" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M5.88657 21C5.57547 21 5.3399 20.7189 5.39427 20.4126L6.00001 17H2.59511C2.28449 17 2.04905 16.7198 2.10259 16.4138L2.27759 15.4138C2.31946 15.1746 2.52722 15 2.77011 15H6.35001L7.41001 9H4.00511C3.69449 9 3.45905 8.71977 3.51259 8.41381L3.68759 7.41381C3.72946 7.17456 3.93722 7 4.18011 7H7.76001L8.39677 3.41262C8.43914 3.17391 8.64664 3 8.88907 3H9.87344C10.1845 3 10.4201 3.28107 10.3657 3.58738L9.76001 7H15.76L16.3968 3.41262C16.4391 3.17391 16.6466 3 16.8891 3H17.8734C18.1845 3 18.4201 3.28107 18.3657 3.58738L17.76 7H21.1649C21.4755 7 21.711 7.28023 21.6574 7.58619L21.4824 8.58619C21.4406 8.82544 21.2328 9 20.9899 9H17.41L16.35 15H19.7549C20.0655 15 20.301 15.2802 20.2474 15.5862L20.0724 16.5862C20.0306 16.8254 19.8228 17 19.5799 17H16L15.3632 20.5874C15.3209 20.8261 15.1134 21 14.8709 21H13.8866C13.5755 21 13.3399 20.7189 13.3943 20.4126L14 17H8.00001L7.36323 20.5874C7.32086 20.8261 7.11336 21 6.87093 21H5.88657ZM9.41045 9L8.35045 15H14.3504L15.4104 9H9.41045Z"></path></svg>
            <h2 id="chat-header-title" class="font-bold text-white">channel-name</h2>
            <div class="ml-4 w-px h-6 bg-[#4f545c]"></div>
            <p id="chat-header-desc" class="ml-4 text-sm text-[#b9bbbe] truncate">Channel description</p>
        </div>

        <!-- Messages Area -->
        <div class="flex-1 overflow-y-auto px-4 py-6 flex flex-col space-y-4" id="messages-container">
            <!-- Messages injected here via JS -->
        </div>

        <!-- Input Area -->
        <div class="px-4 pb-6">
            <div class="bg-[#383a40] rounded-lg p-3 flex items-center focus-within:ring-2 focus-within:ring-[#5865F2] transition-shadow">
                <button class="w-6 h-6 bg-[#b9bbbe] text-[#383a40] rounded-full flex items-center justify-center font-bold text-lg hover:bg-[#dcddde] mr-4 transition-colors">+</button>
                <input type="text" id="chat-input" placeholder="Message #channel-name" class="bg-transparent flex-1 outline-none text-[#dcddde] placeholder-[#72767d]">
                <div class="flex space-x-3 ml-4 text-[#b9bbbe]">
                    <svg class="w-6 h-6 hover:text-[#dcddde] cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <svg class="w-6 h-6 hover:text-[#dcddde] cursor-pointer" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                </div>
            </div>
            <div class="text-[10px] text-[#72767d] mt-2 text-center">
                *This is a static simulation. Messages cannot be sent.*
            </div>
        </div>
    </div>

    <!-- Mobile Sidebar Overlay -->
    <div id="mobile-sidebar" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden md:hidden">
        <div class="w-64 bg-[#2f3136] h-full flex flex-col transform transition-transform" id="mobile-sidebar-content">
             <div class="h-12 border-b border-[#202225] flex items-center justify-between px-4 shadow-sm bg-[#202225]">
                 <h1 class="font-bold text-white">Video Editors Hub</h1>
                 <button onclick="toggleMobileSidebar()" class="text-[#dcddde]"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
             </div>
             <div id="mobile-channel-list" class="flex-1 overflow-y-auto p-2 space-y-0.5 pb-4">
                 <!-- Mirrored channel list -->
             </div>
        </div>
    </div>

    <script>
        const conversations = [
            {
                id: 'fixed-price',
                category: 'Negotiations',
                name: 'fixed-price',
                description: 'Payment Per Project (Fixed Price)',
                messages: [
                    { sender: 'Client', text: "Hi! I need a 30-second promotional video for my new product launch. When can you have it ready?" },
                    { sender: 'Editor', text: "Hey! I can definitely do that. For a 30-second promotional video, I charge a flat rate of $500 per project. This includes color grading, sound design, and two rounds of revisions. How soon do you need it?" },
                    { sender: 'Client', text: "$500 seems a bit high for just 30 seconds. Can you do it for $350?" },
                    { sender: 'Editor', text: "I appreciate the offer, but the $500 is a fixed project rate, not based on duration. It covers all the editing work, effects, and revisions. I could do $400 if you're flexible with the deadline. How urgent is this?" },
                    { sender: 'Client', text: "We need it in 5 days. Can you meet that timeline?" },
                    { sender: 'Editor', text: "Five days is tight for quality work. I can do it, but that would be $500 as quoted. If you can give me 7-10 days, I can bring it down to $400." },
                    { sender: 'Client', text: "Let's compromise. $450 and 7 days?" },
                    { sender: 'Editor', text: "Deal! $450 as a fixed project rate for a 7-day turnaround. I'll send you the contract details." }
                ]
            },
            {
                id: 'per-minute',
                category: 'Negotiations',
                name: 'per-minute',
                description: 'Payment Per Minute of Video',
                messages: [
                    { sender: 'Client', text: "We need a 15-minute corporate training video. What's your rate?" },
                    { sender: 'Editor', text: "For corporate videos, I charge $80 per finished minute. So for a 15-minute video, that would be $1,200." },
                    { sender: 'Client', text: "That's quite expensive. We're a small startup. Is there a discount?" },
                    { sender: 'Editor', text: "What's your budget range?" },
                    { sender: 'Client', text: "We were thinking around $800-$900." },
                    { sender: 'Editor', text: "At $800-$900, that would be roughly 10-11 minutes of finished video. Can you work with a shorter version?" },
                    { sender: 'Client', text: "Not really. We need all 15 minutes. What if we reduce the complexity? Less color grading, simpler transitions?" },
                    { sender: 'Editor', text: "Even with simpler editing, the per-minute rate stays the same because it's based on the finished video length. However, I can offer $70 per minute if you commit to a 2-week turnaround instead of 1 week. That would be $1,050 for 15 minutes." },
                    { sender: 'Client', text: "That works better. $70 per minute for 15 minutes equals $1,050, and we can do 2 weeks." },
                    { sender: 'Editor', text: "Perfect! So $1,050 total for your 15-minute video with a 2-week deadline. When can you provide the raw footage?" },
                    { sender: 'Client', text: "We'll send it over by tomorrow." },
                    { sender: 'Editor', text: "Great! I'll start as soon as I receive it." }
                ]
            },
            {
                id: 'per-hour',
                category: 'Negotiations',
                name: 'per-hour',
                description: 'Payment Per Hour of Editing Work',
                messages: [
                    { sender: 'Client', text: "Hi! We have about 8 hours of raw wedding footage and want a 10-minute highlight reel. How much would that cost?" },
                    { sender: 'Editor', text: "Congratulations on the wedding! For wedding editing, I charge $75 per hour of editing work. Typically, for 8 hours of raw footage, I estimate about 12-15 hours of editing time to create a polished 10-minute reel." },
                    { sender: 'Client', text: "So that would be around $900-$1,125?" },
                    { sender: 'Editor', text: "Exactly. Let me break it down: I'll watch all 8 hours, select the best moments, sync music, color grade, and add transitions. Based on my experience, I estimate 12-14 hours for this scope. Let's say $1,000 as a fair estimate (approximately 13 hours)." },
                    { sender: 'Client', text: "When can you have it done? We need it in 2 weeks." },
                    { sender: 'Editor', text: "Two weeks is comfortable. I can definitely meet that deadline." },
                    { sender: 'Client', text: "$1,000 is more than we expected. Can you do it for $800?" },
                    { sender: 'Editor', text: "$800 would only cover about 10-11 hours of work. I'd have to rush through the color grading and music selection. For quality work, I need at least $1,000. However, if you're willing to wait 3 weeks, I can fit this in during slower periods and reduce it to $900." },
                    { sender: 'Client', text: "We really need it in 2 weeks. How about $950?" },
                    { sender: 'Editor', text: "I can meet you at $950 for the 2-week turnaround. That's approximately 12-13 hours of work." },
                    { sender: 'Client', text: "Deal! $950 it is. When do you need the footage?" },
                    { sender: 'Editor', text: "Send it over ASAP. I charge $75 per hour, and I'll track my hours carefully. Once I hit approximately 13 hours, I'll have your reel ready." }
                ]
            },
            {
                id: 'monthly-retainer',
                category: 'Negotiations',
                name: 'monthly-retainer',
                description: 'Payment Per Salary (Monthly Retainer)',
                messages: [
                    { sender: 'Client', text: "We're launching a YouTube channel and will need consistent video editing support. We're planning to upload 2-3 videos per week. Can you work with us on an ongoing basis?" },
                    { sender: 'Editor', text: "Absolutely! For ongoing work like that, I offer a monthly retainer model. Instead of per-project pricing, you pay a fixed monthly salary, and I dedicate a certain number of hours to your channel each week." },
                    { sender: 'Client', text: "How much would that be?" },
                    { sender: 'Editor', text: "For 2-3 videos per week (roughly 8-12 hours per week), I offer a monthly retainer of $3,500. This includes 40 hours per month of editing work, revisions, and channel optimization." },
                    { sender: 'Client', text: "That's quite a commitment. What if we start with just 1-2 videos per week?" },
                    { sender: 'Editor', text: "For 1-2 videos per week (roughly 4-6 hours per week), I can do a monthly retainer of $2,000. This covers 20 hours per month." },
                    { sender: 'Client', text: "And what happens if some weeks we need more hours?" },
                    { sender: 'Editor', text: "Great question. The retainer includes up to 20 hours per month. Any hours beyond that are billed at $50 per hour. So if you need extra editing one week, we just add those hours." },
                    { sender: 'Client', text: "What if we need fewer hours one month?" },
                    { sender: 'Editor', text: "The retainer is a fixed monthly commitment. However, if you consistently need fewer hours, we can renegotiate the contract. But for now, let's lock in $2,000 per month for 20 hours, with overage at $50/hour." },
                    { sender: 'Client', text: "And what's the minimum commitment?" },
                    { sender: 'Editor', text: "I require a 3-month minimum contract. After that, we can adjust or renew month-to-month." },
                    { sender: 'Client', text: "Okay, $2,000 per month for 20 hours, 3-month minimum. When can we start?" },
                    { sender: 'Editor', text: "I can start next Monday. I'll send you the retainer agreement with all the terms. Once you sign and make the first payment, we're good to go!" }
                ]
            },
            {
                id: 'hybrid-model',
                category: 'Negotiations',
                name: 'hybrid-rush-model',
                description: 'Hybrid Model - Per Minute + Per Hour for Rush Work',
                messages: [
                    { sender: 'Client', text: "We need a 5-minute product demo video. What's your rate?" },
                    { sender: 'Editor', text: "For product demo videos, I charge $100 per finished minute. So for 5 minutes, that would be $500." },
                    { sender: 'Client', text: "When can you have it done?" },
                    { sender: 'Editor', text: "I can have it ready in 10 business days." },
                    { sender: 'Client', text: "We need it in 3 days. Is that possible?" },
                    { sender: 'Editor', text: "Three days is a rush timeline. I can do it, but I charge an additional $50 per hour for rush work on top of the per-minute rate. Since this is a 5-minute video, I estimate about 8 hours of editing work. So it would be $500 (per-minute rate) plus $400 (8 hours × $50/hour rush fee) = $900 total." },
                    { sender: 'Client', text: "That's a significant increase. Can you negotiate?" },
                    { sender: 'Editor', text: "The rush fee reflects the priority I'm giving your project over my other clients. However, I can offer this: If you can wait 5 days instead of 3, I'll drop the rush fee entirely and just charge the standard $500." },
                    { sender: 'Client', text: "We really need it in 3 days. What if we do $700 total?" },
                    { sender: 'Editor', text: "$700 doesn't cover the rush work. My minimum for a 3-day turnaround is $850. That's $500 for the per-minute rate plus $350 for rush hours." },
                    { sender: 'Client', text: "Okay, $850 for 3 days. But I need daily updates on progress." },
                    { sender: 'Editor', text: "Deal! $850 for a 3-day turnaround with daily progress updates. I'll send you the contract and payment terms. Once I receive payment and all assets, I'll start immediately." },
                    { sender: 'Client', text: "Perfect! Sending everything now." }
                ]
            },
            {
                id: 'follow-up-1',
                category: 'Follow-ups',
                name: 'casual-check-in',
                description: 'Follow-up 1: Casual Check-in (Day 3 of 7)',
                messages: [
                    { sender: 'Client', text: "Hey! Just checking in on the promotional video. How's it coming along? Are we still on track for the 7-day deadline?" },
                    { sender: 'Editor', text: "Hey! Thanks for checking in. I'm making great progress. I've finished the initial color grading and I'm currently working on syncing the music and sound effects. I'd say I'm about 60% done. Should have a rough cut for you by tomorrow or the day after." },
                    { sender: 'Client', text: "Awesome! Can't wait to see it. Any issues so far?" },
                    { sender: 'Editor', text: "None at all. The footage looks great. I'll send you a preview link as soon as the rough cut is ready." },
                    { sender: 'Client', text: "Perfect, thanks!" }
                ]
            },
            {
                id: 'follow-up-2',
                category: 'Follow-ups',
                name: 'timeline-check',
                description: 'Follow-up 2: Slightly Concerned About Timeline (Day 5 of 10)',
                messages: [
                    { sender: 'Client', text: "Hi! We're halfway through our deadline and I wanted to check on the status of the corporate training video. Are we still on schedule?" },
                    { sender: 'Editor', text: "Hi! Yes, we're on track. I've completed about 70% of the editing. I've finished organizing all the footage, added the transitions, and I'm currently working on the color correction and audio mixing. I should have the first draft ready for you by day 7, which gives you 3 days for revisions before the final deadline." },
                    { sender: 'Client', text: "Great to hear! Will there be any issues with the 2-week turnaround we agreed on?" },
                    { sender: 'Editor', text: "No issues at all. I'm ahead of schedule actually. You'll have the first draft early, so we'll have plenty of time for any changes you want to make." },
                    { sender: 'Client', text: "Excellent! Looking forward to seeing it." }
                ]
            },
            {
                id: 'follow-up-3',
                category: 'Follow-ups',
                name: 'urgent-update',
                description: 'Follow-up 3: Urgent Follow-up (Day 8 of 10)',
                messages: [
                    { sender: 'Client', text: "Hi! We're getting close to the deadline and I haven't heard from you yet. Where are we with the wedding highlight reel? We need it for the anniversary party this weekend!" },
                    { sender: 'Editor', text: "Hi! I apologize for the delayed update. I've been deep in the editing process. I'm currently at 85% completion. I've finished selecting all the best moments, synced the music, and I'm in the final stages of color grading. I should have the complete video ready for you by tomorrow evening." },
                    { sender: 'Client', text: "Tomorrow evening? The party is Saturday. Will that be enough time?" },
                    { sender: 'Editor', text: "Yes, absolutely. Tomorrow evening gives you Friday to review it. If you need any quick tweaks, I can turn them around Friday night. You'll definitely have it in time for Saturday." },
                    { sender: 'Client', text: "Okay, thanks for the update. Please send it as soon as it's ready." },
                    { sender: 'Editor', text: "Will do! I'll send you a download link tomorrow by 6 PM." }
                ]
            },
            {
                id: 'follow-up-4',
                category: 'Follow-ups',
                name: 'multiple-checkins',
                description: 'Follow-up 4: Multiple Check-ins (Week 2 of 8)',
                messages: [
                    { sender: 'Client', text: "Hey! We're two weeks into the project and I wanted to see how many of the 10 YouTube videos you've completed. Are we on pace?" },
                    { sender: 'Editor', text: "Hey! Great question. I've completed 3 videos so far and I'm working on the 4th. I'm right on schedule for delivering 2-3 videos per week. The first 3 are ready for you to review whenever you want." },
                    { sender: 'Client', text: "Can you send over the first 3? We'd like to start uploading them." },
                    { sender: 'Editor', text: "Absolutely! I'll send you the download links within the hour. These are the final versions, so they're ready to upload." },
                    { sender: 'Client', text: "Perfect! What about the remaining 7?" },
                    { sender: 'Editor', text: "I'll have videos 4 and 5 ready by end of this week, videos 6 and 7 by next week, and so on. We're tracking well for the 8-week deadline." },
                    { sender: 'Client', text: "Excellent! This is looking great." }
                ]
            },
            {
                id: 'follow-up-5',
                category: 'Follow-ups',
                name: 'retainer-checkin',
                description: 'Follow-up 5: Retainer Check-in (Mid-Month)',
                messages: [
                    { sender: 'Client', text: "Hi! We're halfway through the month on our retainer agreement. How many hours have you used so far? Are we tracking okay?" },
                    { sender: 'Editor', text: "Hi! Great question. So far this month, I've completed 4 videos for you, which totals about 12 hours of work. We have 20 hours included in your retainer, so we're right on track. You still have 8 hours available for the rest of the month if you need any additional edits or rush work." },

        let currentChannelIndex = 0;

        const users = {
            'Client': { color: 'bg-blue-500', initial: 'C', fullName: 'ClientCorp' },
            'Editor': { color: 'bg-emerald-500', initial: 'E', fullName: 'Editor' }
        };

        function generateTimestamp(index) {
            // Fake timestamps spaced out by a few minutes
            const baseTime = new Date();
            baseTime.setHours(10, 0, 0); // Start at 10:00 AM
            const messageTime = new Date(baseTime.getTime() + index * 4 * 60000); // add 4 mins per message
            
            let hours = messageTime.getHours();
            let minutes = messageTime.getMinutes();
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0' + minutes : minutes;
            return `Today at ${hours}:${minutes} ${ampm}`;
        }

        function renderChannels() {
            const channelList = document.getElementById('channel-list');
            const mobileChannelList = document.getElementById('mobile-channel-list');
            channelList.innerHTML = '';
            mobileChannelList.innerHTML = '';

            let currentCategory = '';

            conversations.forEach((conv, index) => {
                // Render category header if it changes
                if (conv.category !== currentCategory) {
                    const isFirst = currentCategory === '';
                    currentCategory = conv.category;
                    
                    const categoryHTML = `
                        <div class="text-xs font-semibold text-[#8e9297] uppercase tracking-wider mb-1 ${isFirst ? '' : 'mt-4'} px-2 flex items-center hover:text-[#dcddde] cursor-pointer">
                            <svg class="w-3 h-3 mr-1" fill="currentColor" viewBox="0 0 24 24"><path d="M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z"/></svg>
                            ${currentCategory}
                        </div>
                    `;
                    channelList.innerHTML += categoryHTML;
                    mobileChannelList.innerHTML += categoryHTML;
                }

                // Render channel
                const isActive = index === currentChannelIndex;
                const channelHTML = `
                    <div onclick="selectChannel(${index})" class="group flex items-center px-2 py-1.5 mx-2 rounded cursor-pointer ${isActive ? 'bg-[#393c43] text-white' : 'text-[#8e9297] hover:bg-[#34373c] hover:text-[#dcddde]'} transition-colors mb-[2px]">
                        <svg class="w-5 h-5 mr-1.5 opacity-60" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M5.88657 21C5.57547 21 5.3399 20.7189 5.39427 20.4126L6.00001 17H2.59511C2.28449 17 2.04905 16.7198 2.10259 16.4138L2.27759 15.4138C2.31946 15.1746 2.52722 15 2.77011 15H6.35001L7.41001 9H4.00511C3.69449 9 3.45905 8.71977 3.51259 8.41381L3.68759 7.41381C3.72946 7.17456 3.93722 7 4.18011 7H7.76001L8.39677 3.41262C8.43914 3.17391 8.64664 3 8.88907 3H9.87344C10.1845 3 10.4201 3.28107 10.3657 3.58738L9.76001 7H15.76L16.3968 3.41262C16.4391 3.17391 16.6466 3 16.8891 3H17.8734C18.1845 3 18.4201 3.28107 18.3657 3.58738L17.76 7H21.1649C21.4755 7 21.711 7.28023 21.6574 7.58619L21.4824 8.58619C21.4406 8.82544 21.2328 9 20.9899 9H17.41L16.35 15H19.7549C20.0655 15 20.301 15.2802 20.2474 15.5862L20.0724 16.5862C20.0306 16.8254 19.8228 17 19.5799 17H16L15.3632 20.5874C15.3209 20.8261 15.1134 21 14.8709 21H13.8866C13.5755 21 13.3399 20.7189 13.3943 20.4126L14 17H8.00001L7.36323 20.5874C7.32086 20.8261 7.11336 21 6.87093 21H5.88657ZM9.41045 9L8.35045 15H14.3504L15.4104 9H9.41045Z"></path></svg>
                        <span class="truncate whitespace-nowrap">${conv.name}</span>
                    </div>
                `;
                channelList.innerHTML += channelHTML;
                mobileChannelList.innerHTML += channelHTML;
            });
        }

        function renderMessages() {
            const conv = conversations[currentChannelIndex];
            document.getElementById('chat-header-title').innerText = conv.name;
            document.getElementById('chat-header-desc').innerText = conv.description;
            document.getElementById('chat-input').placeholder = `Message #${conv.name}`;

            const container = document.getElementById('messages-container');
            container.innerHTML = `
                <!-- Channel Welcome Message -->
                <div class="mt-8 mb-6 ml-2">
                    <div class="w-16 h-16 bg-[#4f545c] rounded-full flex items-center justify-center mb-4">
                        <svg class="w-10 h-10 text-white" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M5.88657 21C5.57547 21 5.3399 20.7189 5.39427 20.4126L6.00001 17H2.59511C2.28449 17 2.04905 16.7198 2.10259 16.4138L2.27759 15.4138C2.31946 15.1746 2.52722 15 2.77011 15H6.35001L7.41001 9H4.00511C3.69449 9 3.45905 8.71977 3.51259 8.41381L3.68759 7.41381C3.72946 7.17456 3.93722 7 4.18011 7H7.76001L8.39677 3.41262C8.43914 3.17391 8.64664 3 8.88907 3H9.87344C10.1845 3 10.4201 3.28107 10.3657 3.58738L9.76001 7H15.76L16.3968 3.41262C16.4391 3.17391 16.6466 3 16.8891 3H17.8734C18.1845 3 18.4201 3.28107 18.3657 3.58738L17.76 7H21.1649C21.4755 7 21.711 7.28023 21.6574 7.58619L21.4824 8.58619C21.4406 8.82544 21.2328 9 20.9899 9H17.41L16.35 15H19.7549C20.0655 15 20.301 15.2802 20.2474 15.5862L20.0724 16.5862C20.0306 16.8254 19.8228 17 19.5799 17H16L15.3632 20.5874C15.3209 20.8261 15.1134 21 14.8709 21H13.8866C13.5755 21 13.3399 20.7189 13.3943 20.4126L14 17H8.00001L7.36323 20.5874C7.32086 20.8261 7.11336 21 6.87093 21H5.88657ZM9.41045 9L8.35045 15H14.3504L15.4104 9H9.41045Z"></path></svg>
                    </div>
                    <h1 class="text-3xl font-bold text-white mb-2">Welcome to #${conv.name}!</h1>
                    <p class="text-[#8e9297] text-base">This is the start of the #${conv.name} channel. Topic: ${conv.description}</p>
                </div>
                <div class="h-px bg-[#3f4147] my-2 w-full"></div>
            `;

            let lastSender = null;

            conv.messages.forEach((msg, index) => {
                const user = users[msg.sender];
                const timestamp = generateTimestamp(index);
                
                // Determine if we need to show the avatar and header, or if it's a consecutive message
                const showHeader = msg.sender !== lastSender;
                
                if (showHeader) {
                    container.innerHTML += `
                        <div class="flex mt-4 hover:bg-[#32353b] py-0.5 px-1 -mx-1 rounded transition-colors group">
                            <div class="w-10 h-10 rounded-full ${user.color} flex-shrink-0 flex items-center justify-center text-white font-bold mt-0.5 mr-4 cursor-pointer hover:opacity-80">
                                ${user.initial}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="flex items-baseline space-x-2">
                                    <span class="font-medium text-white hover:underline cursor-pointer">${user.fullName}</span>
                                    <span class="text-xs text-[#72767d]">${timestamp}</span>
                                </div>
                                <div class="text-[#dcddde] break-words leading-relaxed">${msg.text}</div>
                            </div>
                        </div>
                    `;
                } else {
                    // Consecutive message from the same user (in this specific dataset it strictly alternates, but good practice to include)
                    container.innerHTML += `
                        <div class="flex hover:bg-[#32353b] py-0.5 px-1 -mx-1 rounded transition-colors group">
                            <div class="w-10 mr-4 opacity-0 group-hover:opacity-100 flex items-center justify-center text-[10px] text-[#72767d] select-none">
                                ${timestamp.split(' at ')[1]}
                            </div>
                            <div class="flex-1 min-w-0">
                                <div class="text-[#dcddde] break-words leading-relaxed">${msg.text}</div>
                            </div>
                        </div>
                    `;
                }
                lastSender = msg.sender;
            });

            // Scroll to bottom
            container.scrollTop = container.scrollHeight;
        }

        function selectChannel(index) {
            currentChannelIndex = index;
            renderChannels();
            renderMessages();
            // close mobile sidebar if open
            document.getElementById('mobile-sidebar').classList.add('hidden');
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById('mobile-sidebar');
            if(sidebar.classList.contains('hidden')) {
                sidebar.classList.remove('hidden');
            } else {
                sidebar.classList.add('hidden');
            }
        }

        // Handle Enter key on chat input to mimic sending (clears input)
        document.getElementById('chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter' && this.value.trim() !== '') {
                this.value = ''; // Just clear it since it's a static demo
            }
        });

        // Initial Render
        renderChannels();
        renderMessages();
    </script>
